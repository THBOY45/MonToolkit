# ============================================================
#  Natura Shaders 1.0 — Iris / OptiFine (Minecraft 1.21.x)
#  Shaderpack réaliste et naturel, calibré pour GPU milieu de gamme
# ============================================================

# Profils de qualité
profile.PERFORMANT=SHADOW_PCF=1 SSR_STEPS=8 BLOOM_STRENGTH=0.25 MILKY_WAY=0
profile.EQUILIBRE=SHADOW_PCF=4 SSR_STEPS=16 BLOOM_STRENGTH=0.40 MILKY_WAY=1
profile.QUALITE=SHADOW_PCF=8 SSR_STEPS=32 BLOOM_STRENGTH=0.50 MILKY_WAY=1

# Curseurs du menu
sliders=WAVE_INTENSITY WAVE_SPEED SSR_REFLECT SSR_STEPS SHADOW_PCF SHADOW_SOFTNESS BLOOM_STRENGTH BLOOM_RADIUS VIGNETTE_STRENGTH EXPOSURE FOG_DENSITY STAR_DENSITY EMISSIVE_STRENGTH

# Page d'options
screen=<profile> <empty> WAVE_INTENSITY WAVE_SPEED SSR_REFLECT SSR_STEPS SHADOW_PCF SHADOW_SOFTNESS BLOOM_STRENGTH BLOOM_RADIUS VIGNETTE_STRENGTH EXPOSURE FOG_DENSITY STAR_DENSITY MILKY_WAY EMISSIVE_STRENGTH DYNAMIC_LIGHT

# Colortex1 sans blending pour l'eau (masque + normales propres)
blend.gbuffers_water.colortex1=off

# Le vignettage et l'éclairage vanilla sont gérés par le pack
vignette=false
oldLighting=false
